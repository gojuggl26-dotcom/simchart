# S0-perp: PerpDEX (CLOB・24/7) フォークの骨格層。
#
# ★価格モデルは GBM のみ (§10)。株式 S0 と同じく、尖度 3・|r| 自己相関ゼロ・
# 単一フラクタル・分散比 1 が**正解**である。perp らしい統計量 (太いテール・
# 清算カスケード・funding の鋸歯) は S1-perp 以降で内生的に出す — ここで
# 外生的に入れると段階構築 (何がどの成分から出たか) が壊れる。
#
# 時間軸 (§4.2 — 単一情報源は config.ann_days / seconds_per_day = grid.TimeGrid):
#   ann_days = 365 / 1 日 = 86,400 秒 / 1 分足 1,440 steps
# 結果は results/perp_S0/ に書かれ、株式の results/S0 (ベースライン) とは
# 衝突しない (実行ラベル perp_S0)。

# --- 実行 ---
seed: 42
stage: S0
market_type: perp_clob
session_type: 24h
# 400 週ちょうど (週次プロファイルの 7 ビンが均等に埋まる)。
# 2,800 日 × 1,440 steps = 4.03M 分足 → 尖度の SE ≈ 0.0024。日次系列も 2,800 点
# となり、時間スケール不変性の |r| ACF 対照 (tol 0.07、独立実現差の SD ≈ 0.027)
# が 2.6σ の本物の検定になる (1,400 日では 1.9σ のコイン投げ — 60 日スモークで
# 実測した小標本問題への対処)。
n_days: 2800
steps_per_day: 1440

# --- L2: GBM (§10) ---
sigma_bar: 0.60          # perp の年率ボラ帯 0.5〜1.0 の代表値
mu_drift: 0.0
p0: 100.0

# --- 検証スイートの測定器設定 ---
validation:
  # 基準粒度 1 分 (= 格子刻み)。スケール集合は 24h セッションに合わせる
  # (equity の 23400 は 6.5h セッションの日次 — perp では 86400 が日次)。
  primary_bar_sec: 60
  scales_sec: [60, 120, 300, 600, 900, 1800, 3600, 14400, 43200, 86400]
  min_obs_for_gate: 10000
  # 時間スケール不変性の対照解像度: 5 分足 (1440 / 288 = 5 倍差)。
  scale_invariance_steps_per_day: 288
  # 尖度の解像度間相対差: GBM は解像度に依らず厳密に同分布だが、
  # 乱数実現が独立なので有限標本差が残る (equity S1 の較正と同じ理屈)。
  si_tol_kurtosis_rel: 0.25
