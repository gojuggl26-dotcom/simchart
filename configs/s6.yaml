# S6: ZI 板 (zero-intelligence LOB、Smith et al. 2003) — κ=0 で L2 と完全に切断。
#
# ★この段階の価格には ①③④⑧⑯⑱ は現れない — **それが正しい状態** (指示書 §0)。
# 観測価格は板のミッドになり、L2 の性質が観測に現れるのは S10 の結合から。
# L2 (凍結済み) はそのまま生成され、p* は κ=0 でも毎イベント参照して記録する
# (§10: S10 の結合が 1 行の変更で済み、corr(Δmid, Δp*)≈0 が結合判定の基準になる)。
#
# ★検証規模は 500 日 × 10 シード (指示書 §4: 板統計は L2 統計より遥かに速く収束
# する。5000 日が要るのは ③ の再検証が入る S10 から)。
# ★L2 のパラメータは S5 から 1 つも変更していない (L2 は凍結済み)。

# --- 実行 ---
seed: 42
n_days: 500
steps_per_day: 23400
stage: S6

# --- L3 / S6: ZI 板 (★この段階の差分) ---
# ティックレジーム: **small tick** (スプレッド 2〜5 tick、板構造が観測可能 §7)。
# S4 で確定した市場 (米国株相当) と整合。large tick (スプレッド常時 1 tick、
# キュー長が全て) は板の別世界なので S9 で別 config として分岐する。
enable_book: true
tick_size: 0.01             # p0=100 で 1 tick = 1bp
# レートはスイープで確定 (2026-08-21): スプレッド中央値 3 tick・P95 8・デプス
# ピーク lvl 4・枯渇ゼロ・60 日安定。★μ/α や δ を上げすぎると板が**崩壊**する
# (μ/α=1, δ=10 でスプレッド 43,000 tick を実測 — 補充が枯渇に追いつかない相転移)。
book_mu_mo: 900.0           # 成行の片側到着率 [件/日]。符号 50/50 iid (S6)
book_alpha_lo: 1500.0       # 指値の片側到着率 [件/日]
book_delta_cancel: 5.0      # 板上の各注文の独立取消率 [1/日]
book_mu_place: 0.9          # 配置べき則 P(Δ)∝(Δ+Δ0)^-(1+μ) (指示書の帯 [0.6,1.5])
book_place_offset: 3.0
book_max_place_ticks: 200   # 打ち切り (裾を切らないと遠方に注文が溜まる §6.2)
book_allow_inspread: true   # improvement が無いとスプレッドを狭める機構が存在しない
book_inspread_cap: 10
book_size_round_weight: 0.7 # w·ラウンドロット + (1-w)·Pareto (§6.3)
book_size_pareto_alpha: 2.3
book_lot_values: [1.0, 2.0, 5.0, 10.0]
book_lot_probs: [0.45, 0.25, 0.20, 0.10]
book_snapshot_interval_sec: 60.0
book_snapshot_levels: 10
book_depth_ticks: 10
book_burn_in_days: 5.0      # 統計収集から除外 (§8.1)
book_init_levels: 30
book_init_size: 20.0
book_window_half_ticks: 8000  # ±$80。ZI ミッドの 500 日ウォーク SD ~220 tick に十分

# --- L0 カレンダー (S4 ★) ---
enable_seasonality: true
enable_overnight: true

# セッション構造: 米国株相当の連続単一セッション 6.5 時間。
# 分割セッション (昼休みのある市場) は SESSION_SECONDS を変えて S0〜S3 の基準値を
# 無効化するので、実装せず NotImplementedError で止める (config.py)。
session_type: continuous

# --- L0 / S4: 日内季節性の形 ---
# 表現は「1 + s(u-1/2) + Σ_k (a_k cos 2πku + b_k sin 2πku)」。
# ★線形項 s が要るのは、周期 Fourier だけでは phi(0) == phi(1) となり
# 「寄付 > 引け」(ボラ) と「引け > 寄付」(出来高) のどちらも作れないから。
#
# ★正規化の規約が σ と λ で違う:
#   phi_sigma : (1/T)∫phi² du = 1  — 加算されるのは分散なので**二乗**の平均
#   phi_lambda: (1/T)∫phi  du = 1  — 強度なので一乗の平均
# 片方の規約を流用すると Jensen の不等式の分だけ日次積分分散が目標を外れる。
#
# 係数は「起伏比を指示書 §4.4 の帯の中央に置く」ことから数値的に逆算した:
#   phi_sigma²の最大/最小 = 4.50 (帯 3〜6)  寄付 1.484 / 日中 0.711 / 引け 1.269
#   phi_lambda の最大/最小 = 7.00 (帯 4〜10) 寄付 1.406 / 日中 0.375 / 引け 2.344
phi_sigma_cos: [0.3439, 0.0777, 0.0]
phi_sigma_sin: [0.0, 0.0, 0.0]
phi_sigma_slope: -0.2219
# phi_lambda は S4 では**定義のみで消費されない** (L1 がスタブのため)。
# S7 で Hawkes のベースライン強度に入る。ここで定義しておくのは、作った層と
# 消費する層が離れると正規化の規約 (一乗か二乗か) を取り違えるため。
phi_lambda_cos: [0.7499, 0.1250, 0.0]
phi_lambda_sin: [0.0, 0.0, 0.0]
phi_lambda_slope: 0.9374

# --- L0 / S4: オーバーナイト ---
# ★物理時間比例 (17.5h/6.5h) では作らない。取引の無い時間帯は情報時計がほとんど
# 進まないので、別レジームとして「引けのボラに連動する単一のギャップ」を挿入する:
#   r_ON(d) = c_ON sigma_close(d) z + J_ON(d)
# c_ON は「クローズ・トゥ・クローズ分散に占める ON の寄与」が下の値になるよう逆算。
overnight_variance_share: 0.20
# ギャップは実質ジャンプ的なので発生確率は日中より高い。★ジャンプの大きさは
# **分散シェアで指定**して Kou の eta を逆算する (サイズ倍率で指定すると E[J²] が
# ON の分散予算と噛み合わず、実測シェアが目標の 3 倍になる — 実際にそうなった)。
overnight_jump_prob: 0.06
overnight_jump_variance_share: 0.35

# --- L2 情報価格 ---
sigma_bar: 0.20
mu_drift: 0.0
p0: 100.0
enable_msm: true            # S1
enable_slow_ou: true        # S1
enable_rough: true          # S2
enable_jump: true           # S3 ★
enable_leverage: true       # S3 ★
# (enable_chaos_vol は下の chi_2 ブロックで true — 重複キー禁止)

# --- L2 / S1: 確率ボラ ---
# m0 は書かない (分散配分から solve_m0 で逆算される。d も創発量で指定不可)。
# 分散予算: 最終目標 Var(log sigma) = 0.25 のうち S1 は 0.175 (70%) まで。
# 残り 0.075 は S2 ラフ (0.025) と S5 chi_2 (0.050) の枠。使い切らない。
msm_k: 10
msm_b: 2.0
msm_gamma1_per_day: 0.002   # 1/500 [1/日] — 物理時間定義。時定数レンジ 1〜500 日
vol_var_target_msm: 0.125   # 50% (→ m0 ≈ 1.220)
vol_var_target_slow: 0.050  # 20%
ou_half_life_days: 30.0

# --- L2 / S2: ラフ成分 (fOU) ---
# eta_r は書かない (分散配分から solve_eta_rough で逆算)。非定常な fBm/Volterra は
# 使わない — ドリフトが低周波の見かけの長期記憶として GPH に混入する。
# 専用の物理グリッド (60 秒) で生成するため steps_per_day と独立で、
# 時間スケール不変性が構造的に保たれる。
# H 入力 0.08 の理由: H_latent は合成後の log sigma で測るため MSM の短スケール
# 混入で +0.05〜0.06 系統的に高く出る (実測)。0.10 入力だと測定がゲート上限
# (0.15) に乗る。0.08 入力で測定 ~0.13。gph_d はこの選択に依存しない (実測 ±0.01)。
rough_hurst: 0.08
rough_half_life_days: 0.75  # 1 日以下厳守 (MSM 最速成分の帯域に食い込ませない)
vol_var_target_rough: 0.025 # 10% — S2 の到達点は 0.200 (予算の 80%)
rough_grid_seconds: 60.0

# --- L2 / S3: ジャンプ (Kou 二重指数、ボラ変調強度) ---
# ★指示書の目安 λ=20〜60/年 は η_d=15〜25・JV share 5〜15% と算術的に両立しない
# (λ=40, η_d=18 → JV 83%)。critical ゲート (JV/Hill/歪度) を優先して λ を下げた。
# サイズはべき則でなく指数 (集計正規性のため §3.1)。自己励起は入れない (S11)。
# パラメータ確定の経緯: (λ, η_d, η_u) の格子探索で hill/JV/skew が同時に安定して
# 帯に入る点を選んだ。λ=2.5/η_d=22 は歪度がシード間で [-3.5, -0.25] と暴れ
# (ジャンプ ~50 本に裾が支配される)、λ=8/η_d=50 は歪度が -0.1 を割るシードが出る。
jump_p_up: 0.42             # p < 0.5 → 負の歪度
jump_eta_up: 56.0           # 平均上昇ジャンプ +1.8%。>1 必須 (E[e^J] の存在)
jump_eta_down: 35.0         # 平均下落ジャンプ -2.9% (η_d < η_u で下落が大きい)
jump_lambda_per_year: 5.0   # 基準強度。実効 ~4.2/年
jump_vol_exponent: 1.0      # λ(t) = λ0 (σ_t/σ̄)^1 — 高ボラ期にクラスター
jump_intensity_cap: 10.0
jump_qv_share_target: 0.12  # → σ̄_diff = 0.20 √0.88 (総 QV ~0.20² を維持、実測 JV 整合)
# ★S4 で σ̄_diff にはさらに √(1-overnight_variance_share) が掛かる。そのとき
# **ジャンプ強度にも同じ (1-share) を掛けないと日中の JV 比率が動く** (拡散側だけが
# 縮むため)。加えて λ(t) = λ0 (σ/σ̄)^ρ に phi が入ると平均強度が (1/T)∫phi^ρ du 倍
# (ρ=1 で 0.968 倍) になるので、これも打ち消す。両方まとめて
# jump_intensity_scale が自動で掛かる (l2_price.py)。補正しないと実測 JV シェアが
# 12.7% → 14.9% に跳ねた。補正後の差は +0.00001。設定項目ではなく導出量。

# --- L2 / S3: レバレッジ (2 チャンネル、Brownian bridge 実装) ---
# 相関相手は fGn の whitening innovation (fGn 直結は反持続 -0.43 がバーリターンに
# 乗り移り ② を壊す — 実測 -0.21。経緯は README)。
# ★水準について (2026-08-20 裁定): per-step 相関構成の corr(r, RV_{+1}) は理論上限
# ~-0.06 で指示書の帯 [-0.28,-0.16] に届かず、中速成分による強化は gph_d を最大
# -0.15 動かし ③ を壊す (同じ予算の取り合い)。③ 保全を優先し、レバレッジは
# 方向性 (負) の確認に留めて水準は S10 の板側に委ねる。leverage_mid_var は既定 0。
leverage_rho_rough: -0.60
leverage_rho_slow: -0.35

# --- L1 潜在活動度 ---
enable_hawkes: false        # S7
enable_chaos_lambda: false  # S12
enable_chaos_branching: false  # S12

# --- L3 板 (S6 の本体設定は冒頭の「ZI 板」ブロック — enable_book はそちらで true) ---
enable_metaorder: false        # S8
enable_queue_reactive: false   # S9
enable_uncertainty_zones: false  # S9
kappa: 0.0                     # S10 (κ=0: L2 と切断。p* は参照・記録のみ)

# --- L2 / S5: 決定論的カオス成分 chi_2 (★この段階の差分) ---
# ★値は config.py の既定と**同一**にしてある (単一の情報源は config.py 側)。
# 理由: multiseed のアブレーションは replace(enable_chaos_vol=False) で S4 相当を
# 作るが、chi パラメータが既定値と違うと暗黙 no-op ガードに当たって落ちる。
enable_chaos_vol: true
chaos_system: mackey_glass
chaos_tau_delay: 17.0       # 相関次元 ~2.1 の古典カオス領域 (実測 D2 1.85, λ +0.0071)
chaos_beta: 0.2
chaos_gamma: 0.1
chaos_n_exponent: 10.0
chaos_dt: 0.1               # RK4 固定ステップ。tau/dt = 170 (整数必須)
chaos_ic: 1.2               # 初期条件 = t<=0 の定数履歴 (遅延方程式の完全指定)
chaos_burn_in_units: 1000.0
# 時間写像: MG(17) のスペクトルピーク実測 49.65 単位 → 30 日に置く。
# ★30 日が唯一のクリーンな配置 (2026-08-21 裁定の根拠):
#   基本波 30 日と副次調波 (2 倍周期) 62 日の**両方**が潜在 GPH 判定帯
#   (帯域 0.50 = 周期 70 日以上) の外側に収まる。36〜40 日だと副次調波が帯に入り
#   inv_gph_d が -0.03〜-0.05 動く (実測 — 誤配置はゲートが正しく検出する)。
chaos_days_per_unit: 0.6042
vol_var_target_chaos: 0.050 # S1 から予約されていた枠。25% 超は config が弾く
chaos_normalization: standardize  # 案 A。合成 log σ が双峰化したら ecdf_normal (案 B)
chaos_cache_dir: cache

# --- フィードバック ---
enable_feedback: false      # S11
feedback_gain: 0.0

# --- 多資産 ---
n_assets: 1                 # S13

# --- 検証スイートの測定器設定 ---
# ★既存キーは s0.yaml と同一値のまま (段階間比較の前提)。S1 で追加された
# 測定器 (daily / ensemble / scale invariance) の設定のみ新規。
validation:
  primary_bar_sec: 60
  scales_sec: [1, 2, 5, 10, 30, 60, 120, 300, 600, 900, 1800, 23400]
  min_obs_for_gate: 10000

  acf_max_lag: 100
  acf_abs_max_lag: 1000
  ljung_box_lags: [1, 5, 10, 20, 50]
  ljung_box_primary_lag: 20

  gph_bandwidth_exponent: 0.65
  gph_bandwidth_profile: [0.5, 0.6, 0.65, 0.7, 0.8]
  lw_bandwidth_exponent: 0.65

  hill_k_fracs: [0.005, 0.01, 0.02, 0.05, 0.10]
  hill_primary_k_frac: 0.05
  qq_n_points: 201

  vr_qs: [2, 4, 8, 16, 32, 64]
  zeta_qs: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  adf_maxlag: 10

  micro_max_lag: 200
  micro_fit_lag_range: [5, 200]
  rng_probe_draws: 1000

  # --- S1 追加: 日次系列の測定器 ---
  daily_acf_max_lag: 150
  daily_powerlaw_lag_range: [1, 100]
  daily_gph_bandwidth_exponent: 0.65
  daily_scales_days: [1, 2, 5, 10, 20, 50]
  daily_min_obs_for_gate: 250
  daily_zeta_qs: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

  # --- S1 追加: アンサンブル断面と時間スケール不変性 ---
  # (si_tol は S1 実測のペア差分布に基づく現行既定値)
  ensemble_n_paths: 200000
  scale_invariance_steps_per_day: 390
  si_tol_kurtosis_rel: 0.25
  si_tol_gph_d_abs: 0.10
  si_tol_acf1_abs: 0.07
  si_tol_var_logvol_abs: 0.025

  # --- S2 追加: 粗さ H の測定器と S1 不変性トレランス ---
  # ★H の測定窓 (5 分〜4 時間) と GPH の測定窓 (1〜100 日) を重ねない (指示書 §7)
  rough_h_scales_seconds: [300, 600, 1200, 1800, 3600, 7200, 14400]
  rough_h_qs: [0.5, 1.0, 1.5, 2.0, 3.0]
  rv_window_seconds: 1800
  vol_incr_acf_max_lag: 60
  # inv_gph_d は S3 では**潜在 log σ の GPH** で判定 (観測 |r| はジャンプ・レバレッジ
  # の白色混入で下方バイアスされるため)。tol 0.07 は OU 再実現ゆらぎの実測分布
  # (S2↔S3 ペア差 mean +0.016, max +0.060, 系統シフトなし) の外側。
  # ★S5: ③ 不変の判定は同一 run 内のカオス・アブレーション (帯域 0.50) で行い、
  # tol は指示書 §11 の ±0.03 (pipeline 側で min(この値, 0.03) を適用)。
  # 実測: ピーク 30 日で Δd 中央値 +0.0006、誤配置 36〜40 日は -0.03〜-0.05 で落ちる。
  inv_tol_gph_d_abs: 0.03
  inv_tol_powerlaw_gamma_rel: 0.10
  # プロファイル tol: ジャンプが |r| ACF に加える希釈の実測 (0.016〜0.028) の外側。
  inv_tol_acf_profile_mean_abs: 0.035
  inv_tol_kurtosis_daily_increase: 0.5
  inv_tol_zeta_c2_abs: 0.005
  # ★S4 で追加した測定器は無い。季節性の検定 (プロファイル平坦さ・スペクトル
  # 高調波・φ 推定精度) はいずれも primary_bar_sec と daily の既存設定だけで
  # 動くように書いてある。設定を増やさないのは、段階間比較の前提を壊さないため。
